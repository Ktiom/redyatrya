<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Педиатрия: Мега-Тренажер (250 вопросов)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #111827 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
        
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .quiz-count { color: #94a3b8; font-size: 14px; font-weight: 600; }
        .quiz-score { color: #38bdf8; font-weight: 700; font-size: 15px; }
        
        .progress-bar-container { background: rgba(255, 255, 255, 0.05); height: 6px; border-radius: 6px; margin-bottom: 28px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #38bdf8, #6366f1); width: 0%; transition: width 0.3s ease; }
        
        .question-text { font-size: 18px; line-height: 1.6; font-weight: 600; margin-bottom: 28px; color: #f1f5f9; text-align: left; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 15px;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            width: 100%;
        }
        .option-btn:not(.answered):hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); color: #fff; transform: translateY(-1px); }
        .option-btn span { color: #64748b; font-weight: bold; margin-right: 12px; font-size: 14px; }
        
        .option-btn.correct { background: rgba(16, 185, 129, 0.15) !important; border-color: #10b981 !important; color: #34d399 !important; font-weight: 600; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.15) !important; border-color: #ef4444 !important; color: #f87171 !important; }
        .option-btn.answered { cursor: default; }

        .explanation-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            text-align: left;
            font-size: 14.5px;
            line-height: 1.6;
            animation: slideDown 0.35s ease-out;
        }
        .explanation-box.status-correct { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.25); }
        .explanation-box.status-wrong { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.25); }
        
        .explanation-box strong { display: block; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
        .explanation-box.status-correct strong { color: #34d399; }
        .explanation-box.status-wrong strong { color: #f87171; }
        .explanation-text { color: #e2e8f0; display: block; }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff; border: none; padding: 16px 40px; border-radius: 50px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .btn-next { width: 100%; margin-top: 24px; border-radius: 14px; }

        .result-title { font-size: 64px; font-weight: 800; margin-bottom: 8px; }
        .result-msg { font-size: 22px; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
        .result-stats { color: #94a3b8; font-size: 16px; margin-bottom: 32px; }
        .review-zone { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; max-height: 400px; overflow-y: auto; padding-right: 8px; }
        
        .review-item { border-radius: 14px; padding: 18px; text-align: left; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
        .review-item.review-correct { border-left: 4px solid #10b981; }
        .review-item.review-wrong { border-left: 4px solid #ef4444; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-screen" class="container text-center">
        <div class="icon">🩺</div>
        <h1>Педиатрия: Высшая Школа (250 вопросов)</h1>
        <p class="subtitle">Интерактивный симулятор экспертного уровня.<br>Включает ситуационные кейсы, дифференциальную диагностику и протоколы ИВБДВ/РК.<br>6 вариантов ответа, подробнейший разбор к каждому вопросу.</p>
        <button class="btn-primary" onclick="startQuiz()">Начать тестирование</button>
    </div>

    <div id="quiz-screen" class="container hidden">
        <div class="quiz-header">
            <span id="quiz-count" class="quiz-count">Вопрос 1 из 20</span>
            <span id="quiz-score" class="quiz-score">Правильных: 0</span>
        </div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="question-text" class="question-text"></p>
        <div id="options-list" class="options-list"></div>
        
        <div id="explanation-box" class="explanation-box hidden">
            <strong id="explanation-title">Разбор</strong>
            <span id="explanation-text" class="explanation-text"></span>
        </div>

        <button id="btn-next" class="btn-primary btn-next hidden" onclick="nextQuestion()">Продолжить →</button>
    </div>

    <div id="result-screen" class="container text-center hidden">
        <div id="result-medal" class="icon">🎓</div>
        <h2 id="result-pct" class="result-title">0%</h2>
        <p id="result-msg" class="result-msg"></p>
        <p id="result-stats" class="result-stats"></p>
        <button class="btn-primary" onclick="startQuiz()">Пройти заново</button>
        
        <div id="review-zone" class="review-zone"></div>
    </div>

    <script>
        const ALL_QUESTIONS = [
            {
                q: "Вопрос 1: На основе критериев ИВБДВ/РК, какой признак указывает на классификацию «Жестокое обращение с ребенком»?",
                a: "Множественные травмы в разные сроки заживления или травмы, несовместимые с объяснением опекуна",
                wrong: [
                    "Небольшие ссадины на локтях и коленях при активной игре ребенка",
                    "Единичный синяк на лбу после падения с велосипеда",
                    "Небольшие порезы пальцев при работе с ножницами на уроке",
                    "Гематома на голове после удара мячом во время спортивной игры",
                    "Ссадины на коленях после падения во время бега"
                ],
                exp: "Жестокое обращение по ИВБДВ определяется наличием множественных повреждений на разных стадиях заживления, травм геометрической формы (следы удара, прижатия), повреждений внутренних органов без адекватного объяснения. Требуется немедленное уведомление органов защиты детей и стационарная помощь."
            },
            {
                q: "Вопрос 2: По критериям ИВБДВ, какой показатель частоты дыхания свидетельствует о тяжелой пневмонии у ребенка 4 лет?",
                a: "≥50 вдохов в минуту в состоянии покоя",
                wrong: [
                    "30-35 вдохов в минуту",
                    "40-45 вдохов в минуту",
                    "35-40 вдохов в минуту",
                    "45-50 вдохов в минуту",
                    "25-30 вдохов в минуту"
                ],
                exp: "По ИВБДВ, быстрое дыхание (тахипноэ) для ребенка 3-4 лет определяется как ≥40 вдохов/мин, а признак общей опасности (включая тяжелую пневмонию) — ≥50 вдохов/мин. При наличии втяжения уступчивых мест грудной клетки — это тяжелая пневмония, требующая первой дозы антибиотика в стационаре."
            },
            {
                q: "Вопрос 3: Согласно ИВБДВ/РК, какой компонент входит в «цепь выживания» при сердечной остановке у ребенка?",
                a: "Распознавание (вызов скорой помощи) → начало СЛР → дефибрилляция → профессиональная помощь",
                wrong: [
                    "Только начало искусственного дыхания без компрессии грудной клетки",
                    "Прием лекарств без проведения реанимационных мероприятий",
                    "Ожидание приезда скорой помощи без проведения первой помощи",
                    "Использование дефибриллятора на первом этапе без массажа сердца",
                    "Помещение ребенка в горизонтальное положение без других действий"
                ],
                exp: "Цепь выживания включает четыре звена: 1) раннее распознавание и вызов помощи, 2) раннее начало СЛР, 3) ранняя дефибрилляция, 4) ранний доступ к профессиональной помощи. Каждое звено критично для выживания. Компрессия грудной клетки проводится в соотношении 30:2 или непрерывно 100-120 в минуту."
            },
            {
                q: "Вопрос 4: Какой показатель окружности головы свидетельствует о макроцефалии у ребенка в возрасте 6 месяцев по стандартам ИВБДВ?",
                a: ">97-го перцентиля по возрастным таблицам или увеличение на >1 см/неделю",
                wrong: [
                    "Окружность головы более 40 см при рождении",
                    "Увеличение окружности на 0.5 см в месяц",
                    "Окружность головы менее 35 см в 6 месяцев",
                    "Асимметричная форма головы при нормальной окружности",
                    "Наличие открытого большого родничка при нормальной окружности"
                ],
                exp: "Макроцефалия определяется как окружность головы >97-го перцентиля или быстрое увеличение (>1 см в неделю). Требует нейросонографии или МРТ для исключения гидроцефалии, опухолей, кровоизлияний. По ИВБДВ — признак общей опасности, требующий срочной госпитализации."
            },
            {
                q: "Вопрос 5: По ИВБДВ, какой признак указывает на дегидратацию тяжелой степени у ребенка с диареей?",

                wrong: [
                    "Легкая жажда и нормальное наполнение большого родничка",
                    "Нормальное состояние ребенка с единичным жидким стулом",
                    "Слегка сниженный тургор кожи и сухость слизистых",
                    "Нормальная окраска ладоней и нормальное время капиллярного наполнения",
                    "Плач с выделением слез и мочеиспускание каждые 4 часа"
                ],
                exp: "Тяжелая дегидратация по ИВБДВ характеризуется летаргией, очень слабым или неопределяемым пульсом, очень сухими слизистыми, очень медленным (>2 сек) временем капиллярного наполнения, отсутствием мочи. Требует немедленной внутривенной регидратации (10 мл/кг физраствора за 30 мин) и госпитализации."
            },

                q: "Вопрос 6: Какой возраст считается оптимальным для первой ревакцинации БЦЖ по российским календарям, учитывая данные ИВБДВ?",
                a: "7 лет (при отрицательной пробе Манту или диаскинтесте)",
                wrong: [
                    "6 месяцев без дополнительных обследований",
                    "12 месяцев (в год жизни) без предварительного тестирования",
                    "3 года с обязательной БЦЖ-м вакциной",

                ],
                exp: "В России ревакцинация БЦЖ проводится в 7 лет детям с отрицательной пробой Манту или диаскинтестом. Это связано с повышением туберкулезной инфекции в подростковом возрасте. ИВБДВ/РК рекомендуют проверку чувствительности к туберкулину перед ревакцинацией."
            },
            {
                q: "Вопрос 7: По ИВБДВ, какой уровень гемоглобина требует трансфузии крови при острой анемии у 3-летнего ребенка?",
                a: "Симптоматическая анемия (одышка, тахикардия) или Hb <70 г/л",
                wrong: [
                    "Hb менее 120 г/л без каких-либо симптомов",
                    "Hb менее 100 г/л при стабильном состоянии ребенка",
                    "Любое значение Hb менее 110 г/л",
                    "Только при Hb менее 50 г/л независимо от состояния",
                    "При Hb менее 130 г/л с целью профилактики"
                ],
                exp: "Трансфузия проводится при симптоматической анемии (одышка, тахикардия, вялость) или при Hb <70 г/л. Скорость трансфузии 10 мл/кг/час, общий объем 20 мл/кг. Мониторят симптомы перегрузки жидкостью. В хронических случаях стараются избежать трансфузии."
            },
            {
                q: "Вопрос 8: Какой препарат является первой линией для лечения острого приступа бронхообструкции у ребенка по ИВБДВ?",
                a: "Ингаляционный бета-2 агонист (альбутерол/салбутамол) через небулайзер",
                wrong: [
                    "Внутривенный адреналин без предварительной ингаляции",
                    "Глюкокортикостероиды внутримышечно как первый этап",
                    "Антигистаминные препараты пероральной формы",
                    "Муколитики (ацетилцистеин) без бета-2 агонистов",
                    "Теплое молоко с медом перед медикаментозным лечением"
                ],
                exp: "Первая помощь при приступе бронхообструкции: ингаляция альбутерола 0.15 мг/кг (макс 5 мг) через небулайзер, повтор каждые 20 минут в течение часа. Добавляют системный кортикостероид (преднизолон 1-2 мг/кг). При неэффективности требуется стационарная помощь."
            },
            {
                q: "Вопрос 9: По ИВБДВ, какой признак указывает на аллергическую реакцию немедленного типа и требует немедленного введения адреналина?",

                wrong: [
                    "Локальный зуд кожи без системных проявлений",
                    "Легкая гиперемия в месте инъекции через 10 минут",
                    "Повышение температуры через час после контакта",

                    "Изолированная рвота без других симптомов"
                ],
                exp: "Анафилаксия требует немедленного введения адреналина 0.01 мг/кг (0.3-0.5 мл 1:1000) внутримышечно. Признаки: отек лица, языка, горла; стридор; свистящее дыхание; гипотензия; потеря сознания. Возможны кожные реакции (крапивница, гиперемия) и ГИ симптомы. Вторая доза вводится через 5-15 минут при отсутствии эффекта."
            },
            {
                q: "Вопрос 10: Какой тест считается золотым стандартом для подтверждения лямблиоза по ИВБДВ?",

            },
            {
                q: "Вопрос 11: По протоколам ИВБДВ/РК, какой объем первой болюсной инфузии кристаллоида вводится при септическом шоке у ребенка?",

            {
                q: "Вопрос 13: По ИВБДВ, какой возраст и вес ребенка требуют особой осторожности при введении нестероидных противовоспалительных средств?",

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedQuestions = [];
        let userResults = [];

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userResults = [];
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            selectedQuestions = [...ALL_QUESTIONS].sort(() => 0.5 - Math.random()).slice(0, 20);
            
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= selectedQuestions.length) {
                showResults();
                return;
            }

            const qData = selectedQuestions[currentQuestionIndex];
            
            document.getElementById('quiz-count').innerText = `Вопрос ${currentQuestionIndex + 1} из ${selectedQuestions.length}`;
            document.getElementById('quiz-score').innerText = `Правильных: ${score}`;
            document.getElementById('progress-bar').style.width = ((currentQuestionIndex / selectedQuestions.length) * 100) + '%';
            
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');

            const answers = [qData.a, ...qData.wrong].sort(() => 0.5 - Math.random());
            const optionsDiv = document.getElementById('options-list');
            optionsDiv.innerHTML = '';

            answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(btn, ans, qData);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, chosenAnswer, qData) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('answered');
            });

            const isCorrect = (chosenAnswer === qData.a);
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                buttons.forEach(btn => {
                    if (btn.innerText === qData.a) btn.classList.add('correct');
                });
            }

            userResults.push({ 
                q: qData.q, 
                chosen: chosenAnswer, 
                correct: qData.a, 
                isCorrect, 
                exp: qData.exp 
            });

            document.getElementById('explanation-title').innerText = isCorrect ? '✓ Правильно' : '✗ Неправильно';
            document.getElementById('explanation-box').className = 'explanation-box ' + (isCorrect ? 'status-correct' : 'status-wrong');
            document.getElementById('explanation-text').innerText = qData.exp;
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const pct = Math.round((score / selectedQuestions.length) * 100);
            document.getElementById('result-pct').innerText = `${pct}%`;
            document.getElementById('result-msg').innerText = `Правильных ответов: ${score} из ${selectedQuestions.length}`;
            
            let medal = "🥉";
            let msg = "Стоит попрактиковаться ещё";
            if (pct >= 90) { 
                medal = "🥇"; 
                msg = "Отличный результат! Вы экспер!";
            }
            else if (pct >= 75) { 
                medal = "🥈"; 
                msg = "Хороший результат, но есть над чем поработать";
            }
            
            document.getElementById('result-medal').innerText = medal;
            document.getElementById('result-msg').innerText = msg;
            document.getElementById('result-stats').innerText = `Вы ответили правильно на ${score} вопросов из ${selectedQuestions.length}`;

            const reviewDiv = document.getElementById('review-zone');
            reviewDiv.innerHTML = '';

            userResults.forEach((r, idx) => {
                const item = document.createElement('div');
                item.className = `review-item ${r.isCorrect ? 'review-correct' : 'review-wrong'}`;
                
                let reviewContent = `<strong>${idx + 1}. ${r.q}</strong><br>`;
                if (r.isCorrect) {
                    reviewContent += `<span style="color: #34d399; font-weight: 600;">✓ Вы ответили верно: ${r.chosen}</span><br>`;
                } else {
                    reviewContent += `<span style="color: #f87171; font-weight: 600;">✗ Ваш ответ: ${r.chosen}</span><br>`;
                    reviewContent += `<span style="color: #34d399; font-weight: 600;">✓ Правильный ответ: ${r.correct}</span><br>`;
                }
                reviewContent += `<small style="color: rgba(255,255,255,0.7); display:block; margin-top:8px; line-height: 1.4;">${r.exp}</small>`;
                
                item.innerHTML = reviewContent;
                reviewDiv.appendChild(item);
            });
        }

        window.onload = function() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
        };
    </script>
</body>
</html>
